document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

7; --warn:#B45309; --err:#DC2626; --info:#1D4ED8;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif}\na{color:var(--redT)} a:hover{color:var(--wine)}\n@keyframes pmStage{0%,38%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0);transform:translateY(0)}8%,26%{box-shadow:0 0 0 4px var(--glow),0 24px 60px -18px var(--glow);transform:translateY(-8px)}}\n@keyframes pmArrow{0%,8%,44%,100%{opacity:.3}18%,32%{opacity:1}}\n@keyframes pmToast{0%,4%{opacity:0;transform:translateX(90px)}12%,78%{opacity:1;transform:translateX(0)}88%,100%{opacity:0;transform:translateX(90px)}}\n@keyframes pmBadge{0%,10%{transform:scale(0)}16%{transform:scale(1.35)}21%,78%{transform:scale(1)}88%,100%{transform:scale(0)}}\n@keyframes pmAparece{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}\nsection[data-deck-active] [data-anima]{animation:pmAparece var(--anim-entr,.65s) cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(var(--ap,0)*var(--anim-ms,1ms))}\n@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}\n@media print{#pm-tools,#pm-prog{display:none !important}*{animation:none !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"01 · Portada\" data-speaker-notes=\"Bienvenida. Este tutorial enseña la plataforma de ASOBARES Capítulo Quindío a sus tres tipos de usuario. Cada rol puede ver solo lo suyo: Dirección ve Fundamentos + módulo A, Secretaría F + B, Empresario F + C; el módulo D (sitio público) sirve para todos. Arriba a la derecha está el índice por módulos y el conmutador de tema claro/oscuro (la elección se recuerda). La pieza se imprime como manual PDF: una página por lámina.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px;\">\n  <div data-anima=\"1\" style=\"--ap:0;width:470px;height:175px;flex:none;\">\n    <image-slot id=\"logo-oficial\" src=\"ea4ace82-fdd0-4f90-bf74-957129824f3c\" fit=\"contain\" shape=\"rect\" placeholder=\"Suelta aquí el logo oficial del capítulo (SVG, tal cual: sin recolorear ni deformar)\"><\u002Fimage-slot>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:130;display:flex;flex-direction:column;gap:20px;align-items:center;\">\n    <span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--redT);\">Asobares · Capítulo Quindío<\u002Fspan>\n    <h1 style=\"margin:0;font-size:var(--t-hero);font-weight:900;line-height:1.02;max-width:1250px;\">Tutorial de la plataforma<\u002Fh1>\n    <p style=\"margin:0;font-size:30px;font-weight:300;color:var(--muted);\">«La noche construye territorio»<\u002Fp>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:260;display:flex;gap:18px;margin-top:14px;\">\n    <button sc-camel-on-click=\"{{ irA }}\" title=\"Ir al módulo A\" style=\"cursor:pointer;background:transparent;font-family:Poppins,sans-serif;display:flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;border:1.5px solid var(--red);color:var(--redT);font-size:var(--t-small);font-weight:500;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--red);\"><\u002Fspan><span>Dirección · F + A<\u002Fspan><\u002Fbutton>\n    <button sc-camel-on-click=\"{{ irB }}\" title=\"Ir al módulo B\" style=\"cursor:pointer;background:transparent;font-family:Poppins,sans-serif;display:flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;border:1.5px solid var(--rose);color:var(--roseT);font-size:var(--t-small);font-weight:500;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--rose);\"><\u002Fspan><span>Secretaría · F + B<\u002Fspan><\u002Fbutton>\n    <button sc-camel-on-click=\"{{ irC }}\" title=\"Ir al módulo C\" style=\"cursor:pointer;background:transparent;font-family:Poppins,sans-serif;display:flex;align-items:center;gap:12px;padding:14px 28px;border-radius:999px;border:1.5px solid var(--purple);color:var(--purpleT);font-size:var(--t-small);font-weight:500;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--purple);\"><\u002Fspan><span>Empresario · F + C<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:380;display:flex;align-items:center;gap:10px;font-size:var(--t-small);font-weight:300;color:var(--muted);flex-wrap:wrap;justify-content:center;\"><span style=\"font-weight:500;padding:2px 14px;border-radius:8px;border:1px solid var(--line);background:var(--tint);color:var(--ink);\">←<\u002Fspan><span style=\"font-weight:500;padding:2px 14px;border-radius:8px;border:1px solid var(--line);background:var(--tint);color:var(--ink);\">→<\u002Fspan><span>cambiar diapositiva<\u002Fspan><span style=\"opacity:.5;\">·<\u002Fspan><span style=\"font-weight:500;padding:2px 14px;border-radius:8px;border:1px solid var(--line);background:var(--tint);color:var(--ink);\">T<\u002Fspan><span>modo claro u oscuro<\u002Fspan><span style=\"opacity:.5;\">·<\u002Fspan><span style=\"font-weight:500;padding:2px 14px;border-radius:8px;border:1px solid var(--line);background:var(--tint);color:var(--ink);\">Ctrl<\u002Fspan><span style=\"font-weight:500;padding:2px 14px;border-radius:8px;border:1px solid var(--line);background:var(--tint);color:var(--ink);\">P<\u002Fspan><span>imprimir el manual<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"02 · Las tres puertas\" data-speaker-notes=\"La plataforma tiene tres puertas. El sitio público lo ve cualquiera. El panel /admin es la oficina digital de Dirección y Secretaría, con estética de panel de administración. Mi cuenta es el portal privado del empresario afiliado. Regla de oro: cada rol entra solo por su puerta. Si un empresario intenta /admin, el sistema lo bloquea; si alguien del equipo entra por /mi-cuenta/entrar recibe el mensaje literal que se ve en pantalla.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:36px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--gris);\"><\u002Fspan><span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grisT);\">Módulo F · Fundamentos<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">02 / 32<\u002Fspan>\n  <\u002Fheader>\n  <div data-anima=\"1\" style=\"--ap:40;display:flex;flex-direction:column;gap:16px;\">\n    <h1 style=\"margin:0;font-size:var(--t-title);font-weight:900;line-height:1.06;\">Las <span style=\"color:var(--grisT);\">tres puertas<\u002Fspan><\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--gris);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px;\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:40px;font-weight:700;color:var(--tealT);\">/<\u002Fspan>\n      <h3 style=\"margin:0;font-size:30px;font-weight:700;\">Sitio público<\u002Fh3>\n      <span style=\"font-size:var(--t-small);font-weight:500;color:var(--tealT);\">Lo ve cualquiera<\u002Fspan>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;line-height:1.5;color:var(--muted);\">Directorio de establecimientos, guía «Abre tu negocio», bolsa de empleo, artistas, proveedores, eventos, boletín, afiliación y contacto.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:40px;font-weight:700;color:var(--redT);\">/admin<\u002Fspan>\n      <h3 style=\"margin:0;font-size:30px;font-weight:700;\">Panel del gremio<\u002Fh3>\n      <span style=\"font-size:var(--t-small);font-weight:500;color:var(--redT);\">Dirección y Secretaría<\u002Fspan>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;line-height:1.5;color:var(--muted);\">La oficina digital: aquí se administra todo el contenido, las bandejas y el gremio. Estética de panel de administración.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:40px;font-weight:700;color:var(--purpleT);\">/mi-cuenta<\u002Fspan>\n      <h3 style=\"margin:0;font-size:30px;font-weight:700;\">Mi cuenta<\u002Fh3>\n      <span style=\"font-size:var(--t-small);font-weight:500;color:var(--purpleT);\">Empresario afiliado<\u002Fspan>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;line-height:1.5;color:var(--muted);\">Portal privado: estado de cuenta, pago de la mensualidad, historial y convenios.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:300;display:flex;gap:26px;align-items:stretch;\">\n    <div style=\"flex:1;background:var(--tint);border:1px solid var(--line);border-radius:16px;padding:24px 30px;display:flex;align-items:center;gap:16px;\">\n      <span style=\"width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;\"><\u002Fspan>\n      <p style=\"margin:0;font-size:var(--t-body);font-weight:500;\">Regla de oro: cada rol entra solo por su puerta.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex:1.3;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 30px;display:flex;flex-direction:column;gap:8px;\">\n      <span style=\"font-size:var(--t-small);font-weight:500;color:var(--muted);\">Mensaje del sistema al equipo en /mi-cuenta/entrar<\u002Fspan>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;line-height:1.45;\">«Esta entrada es para establecimientos afiliados. El equipo del gremio ingresa por /admin.»<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"03 · La matriz de roles\" data-speaker-notes=\"Tres roles internos: super_admin es la Dirección, subadmin la Secretaría, asociado el Empresario. La frontera clave del sistema: publicar es un permiso distinto de editar. La Secretaría redacta; solo la Dirección publica. El empresario no entra al panel: su mundo es el portal mi-cuenta, donde ve su cartera y sus transacciones. La Secretaría atiende bandejas pero no puede eliminar registros.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:30px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--gris);\"><\u002Fspan><span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grisT);\">Módulo F · Fundamentos<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">03 / 32<\u002Fspan>\n  <\u002Fheader>\n  <div data-anima=\"1\" style=\"--ap:40;display:flex;flex-direction:column;gap:16px;\">\n    <h1 style=\"margin:0;font-size:var(--t-title);font-weight:900;line-height:1.06;\">La matriz de roles<\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--gris);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;background:var(--surface);border:1px solid va y);font-weight:500;\">La frontera clave: <span style=\"color:var(--redT);\">publicar<\u002Fspan> es un permiso distinto de <span style=\"color:var(--roseT);\">editar<\u002Fspan>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"04 · El flujo editorial\" data-speaker-notes=\"El corazón de la plataforma. Al guardar, si quien guarda puede publicar, su elección se respeta; si no, el sistema baja el estado a Pendiente automáticamente. La regla vive en el modelo, no en el formulario: no se puede burlar manipulando la página. Cada envío notifica a la campana de todos los súper admins con el nombre y el título, y un botón Revisar; la campana se refresca cada 30 segundos. La Dirección también puede devolver a Borrador un contenido publicado, y sale del sitio público. Aplica a 9 tipos de contenido.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:30px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--gris);\"><\u002Fspan><span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grisT);\">Módulo F · Fundamentos<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">04 / 32<\u002Fspan>\n  <\u002Fheader>\n  <div data-anima=\"1\" style=\"--ap:40;display:flex;flex-direction:column;gap:16px;\">\n    <h1 style=\"margin:0;font-size:var(--t-title);font-weight:900;line-height:1.06;\">El flujo <span style=\"color:var(--grisT);\">editorial<\u002Fspan><\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--gris);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;display:flex;align-items:center;gap:0;\">\n    <div style=\"--glow:rgba(155,151,1 red);color:var(--redT);display:flex;align-items:center;justify-content:center;font-size:var(--t-small);font-weight:700;\">3<\u002Fspan>\n        <span style=\"font-size:var(--t-body);font-weight:300;\">Edita si hace falta<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;\">\n        <span style=\"flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--red);color:var(--redT);display:flex;align-items:center;justify-content:center;font-size:var(--t-small);font-weight:700;\">4<\u002Fspan>\n        <span style=\"font-size:var(--t-body);font-weight:300;\">Decide: <span style=\"color:var(--ok);font-weight:500;\">aprobar<\u002Fspan> o <span style=\"color:var(--warn);font-weight:500;\">devolver<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:var(--tint);border:1px solid var(--line);border-radius:16px;padding:20px 26px;\">\n        <p style=\"margin:0;font-size:var(--t-small);font-weight:300;line-height:1.5;color:var(--muted);\">¿Sin notificación a mano? En cualquier listado filtra <span style=\"font-weight:500;color:var(--ink);\">Estado → Pendiente de aprobación<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"09 · Aprobar y devolver\" data-speaker-notes=\"Aprobar y publicar abre un modal de confirmación: el contenido queda visible en el sitio público de inmediato. Devolver a borrador saca el contenido del sitio público y vuelve a edición. También hay aprobación en lote con casillas; el sistema re-verifica el permiso registro por registro, así que nadie aprueba de más ni por accidente.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:30px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--red);\"><\u002Fspan><span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--redT);\">Módulo A · Dirección<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">09 / 32<\u002Fspan>\n  <\u002Fheader>\n  <div data-anima=\"1\" style=\"--ap:40;display:flex;flex-direction:column;gap:16px;\">\n    <h1 style=\"margin:0;font-size:var(--t-title);font-weight:900;line-height:1.06;\"><span style=\"color:var(--ok);\">Aprobar<\u002Fspan> y <span style=\"color:var(--warn);\">devolver<\u002Fspan><\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--red);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;display:grid;grid-template-columns:1fr 1fr;gap:26px;\">\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px -40px rgba(0,0,0,.6);\">\n      <span style=\"font-size:var(--t-small);font-weight:500;color:var(--ok);\">Acción · Aprobar y publicar<\u002Fspan>\n      <h3 style=\"margin:0;font-size:30px;font-weight:700;\">Publicar este contenido<\u002Fh3>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.5;\">Quedará visible en el sitio público de inmediato.<\u002Fp>\n      <div style=\"display:flex;justify-content:flex-end;gap:14px;margin-top:6px;\">\n        <span style=\"font-size:var(--t-small);font-weight:500;padding:12px 24px;border-radius:10px;border:1px solid var(--line);color:var(--muted);\">Cancelar<\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:700;padding:12px 24px;border-radius:10px;background:var(--red);color:#F5F3F4;\">Sí, publicar<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px -40px rgba(0,0,0,.6);\">\n      <span style=\"font-size:var(--t-small);font-weight:500;color:var(--warn);\">Acción · Devolver a borrador<\u002Fspan>\n      <h3 style=\"margin:0;font-size:30px;font-weight:700;\">Devolver a borrador<\u002Fh3>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.5;\">Sale del sitio público y vuelve a quedar en edición.<\u002Fp>\n      <div style=\"display:flex;justify-content:flex-end;gap:14px;margin-top:6px;\">\n        <span style=\"font-size:var(--t-small);font-weight:500;padding:12px 24px;border-radius:10px;border:1px solid var(--line);color:var(--muted);\">Cancelar<\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:700;padding:12px 24px;border-radius:10px;background:var(--warn);color:#0B090A;\">Devolver<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:300;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 32px;display:flex;align-items:center;gap:28px;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:12px;\">\n      <span style=\"font-size:26px;font-weight:700;\">Aprobación en lote<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <span style=\"width:26px;height:26px;border-radius:7px;background:var(--red);color:#F5F3F4;display:flex;align-items:center;justify-content:center;font-size:var(--t-small);font-weight:700;\">✓<\u002Fspan>\n        <span style=\"width:26px;height:26px;border-radius:7px;background:var(--red);color:#F5F3F4;display:flex;align-items:center;justify-content:center;font-size:var(--t-small);font-weight:700;\">✓<\u002Fspan>\n        <span style=\"width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);\"><\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">2 seleccionados<\ -height:1.06;\">El mapa del menú<\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--red);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch;\">\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:26px;font-weight:700;\">Contenido<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">🏪 Asociados<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">📅 Eventos y capacitaciones<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">📰 Boletín<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">📋 Guía normativa<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">🚀 Iniciativas del gremio<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:26px;font-weight:700;\">Bolsas<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">💼 Bolsa de empleo<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">🙋 Aspirantes<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">🎧 Artistas<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">📦 Proveedores<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;\">\n      <span style=\"font-size:26px;font-weight:700;\">Bandejas<\u0 :flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--red);color:var(--redT);display:flex;align-items:center;justify-content:center;font-size:var(--t-small);font-weight:700;\">5<\u002Fspan><span style=\"font-size:26px;font-weight:700;\">Publicación<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.45;\">Estado del flujo editorial + interruptor «Destacar en el inicio»: la franja de destacados de la portada.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid color-mix(in srgb, var(--red) 35%, transparent);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--red);color:var(--redT);display:flex;align-items:center;justify-content:center;font-size:var(--t-small);font-weight:700;\">6<\u002Fspan><span style=\"font-size:26px;font-weight:700;\">Datos internos 🔒<\u002Fspan><span style=\"margin-left:auto;font-size:var(--t-small);font-weight:500;color:var(--redT);border:1px solid color-mix(in srgb, var(--red) 40%, transparent);border-radius:999px;padding:4px 14px;\">Privado<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.45;\">«Uso exclusivo de la oficina. Nada de esta sección sale al sitio público.» Representante, correo y teléfono internos, fecha de afiliación, notas.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:300;display:flex;align-items:center;gap:16px;background:color-mix(in srgb, var(--warn) 9%, transparent);border:1px solid color-mix(in srgb, var(--warn) 38%, transparent);border-radius:16px;padding:18px 28px;\">\n    <span style=\"width:1 e=\"font-size:var(--t-small);font-weight:500;padding:8px 20px;border-radius:999px;background:color-mix(in srgb, var(--ok) 14%, transparent);color:var(--ok);border:1px solid color-mix(in srgb, var(--ok) 40%, transparent);\">Confirmada<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.5;\">El paso lo dispara <span style=\"color:var(--ok);font-weight:500;\">solo el pago aprobado<\u002Fspan>. Para eventos gratuitos basta Registrada.<\u002Fp>\n      <div style=\"background:color-mix(in srgb, var(--err) 9%, transparent);border:1px solid color-mix(in srgb, var(--err) 38%, transparent);border-radius:14px;padding:18px 24px;margin-top:auto;\">\n        <p style=\"margin:0;font-size:var(--t-small);font-weight:500;line-height:1.5;\">Nunca confirmes a mano una inscripción paga.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"15 · Cartera: el CSV de la contadora\" data-speaker-notes=\"La cartera no se edita a mano: entra por el CSV de la contadora y se salda con pagos aprobados. Pasos: Gremio, Cartera, Descargar plantilla —un CSV con los datos actuales—, y luego Importar CSV de la contadora. Columnas: establecimiento, saldo_pendiente, meses_mora y opcional ultimo_pago. Tolerancias: encabezados con mayúsculas, tildes o espacios; números colombianos como 1.250.000 con signo pesos; fechas AAAA-MM-DD o DD/MM/AAAA. Nunca aborta por una fila mala: procesa lo válido y muestra hasta 10 errores con número de fila, por ejemplo: no existe un asociado llamado X. La tabla pinta la mora: al día verde, 1 a 2 meses ámbar, 3 o más rojo; saldo con total sumado, último pago, actualizado hace cuánto y filtro solo en mora. El menú muestra un badge rojo con los morosos.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:24px;\">\n  <header style=\"d -radius:999px;background:color-mix(in srgb, var(--err) 14%, transparent);color:var(--err);\">3+ meses<\u002Fspan><\u002Fspan>\n          <span style=\"padding:14px 12px;font-size:var(--t-small);font-weight:500;\">$ 360.000<\u002Fspan>\n          <span style=\"padding:14px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">28/04/2026<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;align-items:center;border-bottom:1px solid var(--line);\">\n          <span style=\"padding:14px 22px;font-size:var(--t-small);font-weight:500;\">La Cava del Yipao<\u002Fspan>\n          <span style=\"padding:8px 12px;\"><span style=\"font-size:var(--t-small);font-weight:500;padding:4px 14px;border-radius:999px;background:color-mix(in srgb, var(--ok) 14%, transparent);color:var(--ok);\">Al día<\u002Fspan><\u002Fspan>\n          <span style=\"padding:14px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">$ 0<\u002Fspan>\n          <span style=\"padding:14px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">2026-07-02<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;align-items:center;\">\n          <span style=\"padding:14px 22px;\"><span style=\"display:inline-block;width:170px;height:14px;border-radius:7px;background:var(--tint);\"><\u002Fspan><\u002Fspan>\n          <span style=\"padding:8px 12px;\"><span style=\"font-size:var(--t-small);font-weight:500;padding:4px 14px;border-radius:999px;background:color-mix(in srgb, var(--warn) 14%, transparent);color:var(--warn);\">1–2 meses<\u002Fspan><\u002Fspan>\n          <span style=\"padding:14px 12px;\"><span style=\"display:inline-block;width:110px;height:14px;border-radius:7px;background:var(--tint);\"><\u002Fspan><\u002Fspan>\n          <span style=\"padding:14px 12px;\"><span style=\"display:inline-block;width:90px;height:14px;border-radius:7px;background:var(--tint);\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;\">\n        <span style=\"font-size:var(--t-small);font-weight:500;padding:6px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);\">Filtro: Solo en mora<\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">Saldo con total sumado · «actualizado hace X» · badge rojo en el menú<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;gap:12px;\">\n        <span style=\"font-size:26px;font-weight:700;\">Columnas del CSV<\u002Fspan>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n          <span style=\"font-size:var(--t-small);font-weight:500;padding:6px 16px;border-radius:10px;background:var(--tint);border:1px solid var(--line);\">establecimiento<\u002Fspan>\n          <span style=\"font-size:var(--t-small);font-weight:500;padding:6px 16px;border-radius:10px;background:var(--tint);border:1px solid var(--line);\">saldo_pendiente<\u002Fspan>\n          <span style=\"font-size:var(--t-small);font-weight:500;padding:6px 16px;border-radius:10px;background:var(--tint);border:1px solid var(--line);\">meses_mora<\u002Fspan>\n          <span style=\"font-size:var(--t-small);font-weight:500;padding:6px 16px;border-radius:10px;background:var(--tint);border:1px solid var(--line);color:var(--muted);\">ultimo_pago · opcional<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 26px;display:flex;flex-direction:column;gap:10px;\">\n        <span style=\"font-size:26px;font-weight:700;\">Tolerante por diseño<\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.5;\">Encabezados con mayúsculas, tildes o espacios · números colombianos ($ 1.250.000) · fechas AAAA-MM-DD o DD/MM/AAAA<\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.5;\"><span style=\"color:var(--ink);font-weight:500;\">Nunca aborta<\u002Fspan>: procesa lo válido y muestra hasta 10 errores con nº de fila<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 22px;display:flex;align-items:center;gap:12px;\">\n        <span style=\"width:10px;height:10px;border-radius:50%;background:var(--err);flex:none;\"><\u002Fspan>\n        <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">Fila 7 · «No existe un asociado llamado “X”»<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"16 · Transacciones\" data-speaker-notes=\"Registro de solo lectura: nadie edita una transacción. Cada una tiene referencia única, concepto —afiliación, inscripción a evento o mensualidad—, monto en pesos, método PSE, tarjeta u otro, y estado pendiente, aprobada o rechazada. Efectos de un pago aprobado: si es mensualidad, la cartera queda al día; si es de evento, la inscripción pasa a confirmada. Es idempotente: los reintentos de la pasarela no duplican nada. En el demo hay una pasarela simulada con la marca del gremio, donde apruebas o rechazas a mano; recorre el mismo camino que Bold —con preferencia PSE— en producción.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:28px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--red);\"><\u002Fspan 2px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Mensualidad<\u002Fspan>\n        <span style=\"padding:16px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">$ 120.000<\u002Fspan>\n        <span style=\"padding:16px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">PSE<\u002Fspan>\n        <span style=\"padding:10px 12px;\"><span style=\"font-size:var(--t-small);font-weight:500;padding:4px 14px;border-radius:999px;background:color-mix(in srgb, var(--ok) 14%, transparent);color:var(--ok);\">Aprobada<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr 1.2fr .9fr .8fr 1fr;align-items:center;border-bottom:1px solid var(--line);\">\n        <span style=\"padding:16px 22px;\"><span style=\"display:inline-block;width:130px;height:14px;border-radius:7px;background:var(--tint);\"><\u002Fspan><\u002Fspan>\n        <span style=\"padding:16px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Inscripción a evento<\u002Fspan>\n        <span style=\"padding:16px 12px;\"><span style=\"display:inline-block;width:90px;height:14px;border-radius:7px;background:var(--tint);\"><\u002Fspan><\u002Fspan>\n        <span style=\"padding:16px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Tarjeta<\u002Fspan>\n        <span style=\"padding:10px 12px;\"><span style=\"font-size:var(--t-small);font-weight:500;padding:4px 14px;border-radius:999px;background:color-mix(in srgb, var(--warn) 14%, transparent);color:var(--warn);\">Pendiente<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr 1.2fr .9fr .8fr 1fr;align-items:center;\">\n        <span style=\"padding:16px 22px;\"><span style=\"display:inline-block;width:130px;height:14px;border-radius:7px;background:var(--tint);\"><\u002Fspan><\u002Fspan>\n        <span style=\"padding:16px 12px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Afil ;font-weight:300;color:var(--muted);line-height:1.4;\">Beneficios + formulario<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;\"><span style=\"font-size:25px;font-weight:700;\">Contacto<\u002Fspan><span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.4;\">Tipos · PQR con radicado y acuse<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"31 · Del panel al sitio\" data-speaker-notes=\"Cada cosa que se aprueba en el panel aparece en su lugar del sitio. Asociados van al directorio y a destacados cuando están publicados. La guía alimenta abre tu negocio; el municipio solo se ve con requisitos publicados. Eventos van a /eventos con inscripción si la permiten. Boletín a /boletin. Vacantes a /empleo, a nombre de un asociado. Artistas y proveedores a sus directorios; el proveedor solo dentro de su visible hasta. Aliados al inicio, y sus convenios privados a mi-cuenta. Beneficios va directo a /afiliate, y Ajustes cambia los textos de todo el sitio al instante, solo Dirección. Los formularios públicos caen a las bandejas, con Habeas Data y límite de envíos.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:24px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--teal);\"><\u002Fspan><span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--tealT);\">Módulo D · Sitio público<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">31 / 32<\u002Fspan>\n  <\u002Fheader>\n  <div data-anima=\"1\" style=\"--ap:40;display:flex;flex-direction:column;gap:16px;\">\n    <h1 style=\"margin:0;font-size:var(--t-title);font-weight:900;line-height:1.06;\">Del panel al sitio<\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--teal);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;\">\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Asociados<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">/directorio y destacados · si está Publicado<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Guía normativa<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">/abre-tu-negocio · municipio visible solo con requisitos publicados<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Eventos<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">/eventos · con inscripción si la permite<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Boletín<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">/boletin<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Vacantes<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">/empleo · siempre a nombre de un asociado<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Artistas y proveedores<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Sus directorios · proveedor dentro de su «visible hasta»<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Aliados<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Inicio + convenios privados en mi-cuenta<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;border-bottom:1px solid var(--line);\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Beneficios<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">/afiliate · directo, sin flujo editorial<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 46px 1.55fr;align-items:center;\"><span style=\"padding:12px 28px;font-size:var(--t-small);font-weight:500;\">Ajustes<\u002Fspan><span style=\"font-size:var(--t-small);color:var(--tealT);text-align:center;\">→<\u002Fspan><span style=\"padding:12px 20px;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Textos de todo el sitio · directo, solo Dirección<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p data-anima=\"1\" style=\"--ap:300;margin:0;font-size:var(--t-small);font-weight:300;color:var(--muted);\">Y al revés: los formularios públicos caen a las bandejas, con Habeas Data y límite de envíos.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"32 · Reglas de oro\" data-speaker-notes=\"Cierre. Dirección: revisa la campana a diario, aprueba o devuelve, importa la cartera de la contadora, da y quita llaves; solo ella publica, elimina y ve el dinero. Secretaría: redacta sin miedo, nada sale sin aprobación; las bandejas son suyas, que no se acumulen las PQR. Empresario: entra por /mi-cuenta, mira cuánto debe, paga con PSE y queda al día al instante; él decide qué datos suyos se publican. La noche construye territorio.\" style=\"background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding:var(--pad-top) var(--pad-x) var(--pad-bottom);display:flex;flex-direction:column;gap:34px;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:14px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:var(--red);\"><\u002Fspan><span style=\"font-size:var(--t-small);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--redT);\">Cierre<\u002Fspan><\u002Fdiv>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);\">32 / 32<\u002Fspan>\n  <\u002Fheader>\n  <div data-anima=\"1\" style=\"--ap:40;display:flex;flex-direction:column;gap:16px;\">\n    <h1 style=\"margin:0;font-size:var(--t-title);font-weight:900;line-height:1.06;\">Reglas de oro, <span style=\"color:var(--redT);\">por rol<\u002Fspan><\u002Fh1>\n    <div style=\"width:112px;height:6px;border-radius:3px;background:var(--red);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:150;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;\">\n    <div style=\"background:var(--surface);border:1px solid color-mix(in srgb, var(--red) 40%, transparent);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--red);\"><\u002Fspan><span style=\"font-size:28px;font-weight:700;color:var(--redT);\">Dirección<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.55;\">Revisa la campana a diario · aprueba o devuelve · importa la cartera · da y quita llaves.<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:500;line-height:1.55;\">Solo tú publicas, eliminas y ves el dinero.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid color-mix(in srgb, var(--rose) 40%, transparent);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--rose);\"><\u002Fspan><span style=\"font-size:28px;font-weight:700;color:var(--roseT);\">Secretaría<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.55;\">Redacta sin miedo: nada sale sin aprobación.<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:500;line-height:1.55;\">Las bandejas son tuyas: que no se acumulen las PQR.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid color-mix(in srgb, var(--purple) 40%, transparent);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"display:flex;align-items:center;gap:12px;\"><span style=\"width:14px;height:14px;border-radius:50%;background:var(--purple);\"><\u002Fspan><span style=\"font-size:28px;font-weight:700;color:var(--purpleT);\">Empresario<\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);line-height:1.55;\">Entra por /mi-cuenta · mira cuánto debes · paga con PSE y quedas al día al instante.<\u002Fspan>\n      <span style=\"font-size:var(--t-small);font-weight:500;line-height:1.55;\">Tú decides qué datos tuyos se publican.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anima=\"1\" style=\"--ap:300;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;\">\n    <p style=\"margin:0;font-size:46px;font-weight:900;\">«La noche construye territorio»<\u002Fp>\n    <span style=\"font-size:var(--t-small);font-weight:300;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;\">Asobares · Capítulo Quindío<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<div id=\"pm-prog\" style=\"position:fixed;top:0;left:0;right:0;height:4px;z-index:70;pointer-events:none;\">\n  <div id=\"pm-prog-fill\" style=\"height:100%;width:3.2%;background:#9B979A;transition:width .35s ease, background .5s ease;\"><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"pm-tools\" style=\"position:fixed;top:14px;right:16px;z-index:70;display:flex;align-items:center;gap:8px;background:color-mix(in srgb, var(--bg) 80%, transparent);border:1px solid var(--line);border-radius:999px;padding:8px 12px;backdrop-filter:blur(10px);font-family:Poppins,sans-serif;\">\n  <button id=\"pm-ch-f\" sc-camel-on-click=\"{{ irF }}\" title=\"Fundamentos · 1–5\" style=\"cursor:pointer;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:Poppins,sans-serif;font-size:24px;font-weight:500;\">F<\u002Fbutton>\n  <button id=\"pm-ch-a\" sc-camel-on-click=\"{{ irA }}\" title=\"Dirección · 6–19\" style=\"cursor:pointer;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:Poppins,sans-serif;font-size:24px;font-weight:500;\">A<\u002Fbutton>\n  <button id=\"pm-ch-b\" sc-camel-on-click=\"{{ irB }}\" title=\"Secretaría · 20–25\" style=\"cursor:pointer;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:Poppins,sans-serif;font-size:24px;font-weight:500;\">B<\u002Fbutton>\n  <button id=\"pm-ch-c\" sc-camel-on-click=\"{{ irC }}\" title=\"Empresario · 26–29\" style=\"cursor:pointer;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:Poppins,sans-serif;font-size:24px;font-weight:500;\">C<\u002Fbutton>\n  <button id=\"pm-ch-d\" sc-camel-on-click=\"{{ irD }}\" title=\"Sitio público y cierre · 30–32\" style=\"cursor:pointer;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:Poppins,sans-serif;font-size:24px;font-weight:500;\">D<\u002Fbutton>\n  <span style=\"width:1px;height:26px;background:var(--line);\"><\u002Fspan>\n  <button sc-camel-on-click=\"{{ cambiarTema }}\" title=\"Cambiar tema (se recuerda tu elección)\" style=\"cursor:pointer;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-family:Poppins,sans-serif;font-size:24px;font-weight:500;\">{{ temaEtiqueta }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;temaInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;oscuro&quot;,&quot;claro&quot;],&quot;default&quot;:&quot;oscuro&quot;,&quot;tsType&quot;:&quot;'oscuro'|'claro'&quot;,&quot;section&quot;:&quot;Presentación&quot;},&quot;animaciones&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Presentación&quot;}}\">\nclass Component extends DCLogic {\n  state = { tema: 'oscuro' };\n  componentDidMount() {\n    let guardado = null;\n    try { guardado = localStorage.getItem('asobares-tutorial-tema'); } catch (e) {}\n    const inicial = (guardado === 'claro' || guardado === 'oscuro') ? guardado : (this.props.temaInicial ?? 'oscuro');\n    this._setTema(inicial, false);\n    this._aplicarAnim();\n    this._mods = [\n      { id: 'pm-ch-f', ini: 0, color: '#9B979A', oscuro: true },\n      { id: 'pm-ch-a', ini: 5, color: '#EE4137', oscuro: false },\n      { id: 'pm-ch-b', ini: 19, color: '#EA698B', oscuro: false },\n      { id: 'pm-ch-c', ini: 25, color: '#C05299', oscuro: false },\n      { id: 'pm-ch-d', ini: 29, color: '#3FB8AC', oscuro: true }\n    ];\n    this._onKey = (e) => {\n      if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey) {\n        this._setTema(this.state.tema === 'oscuro' ? 'claro' : 'oscuro', true);\n      }\n    };\n    document.addEventListener('keydown', this._onKey);\n    this._wire();\n  }\n  componentDidUpdate(prev) {\n    if (prev && prev.temaInicial !== this.props.temaInicial && (this.props.temaInicial === 'claro' || this.props.temaInicial === 'oscuro')) {\n      this._setTema(this.props.temaInicial, true);\n    }\n    this._aplicarAnim();\n  }\n  componentWillUnmount() {\n    clearTimeout(this._t);\n    if (this._onKey) document.removeEventListener('keydown', this._onKey);\n    if (this._stage && this._onSC) this._stage.removeEventListener('slidechange', this._onSC);\n  }\n  _aplicarAnim() {\n    const on = (this.props.animaciones ?? true);\n    const r = document.documentElement.style;\n    r.setProperty('--anim-play', on ? 'running' : 'paused');\n    r.setProperty('--anim-entr', on ? '.65s' : '0s');\n    r.setProperty('--anim-ms', on ? '1ms' : '0ms');\n  }\n  _setTema(t, guardar) {\n    document.documentElement.setAttribute('data-tema', t);\n    this.setState({ tema: t });\n    if (guardar) { try { localStorage.setItem('asobares-tutorial-tema', t); } catch (e) {} }\n  }\n  _wire() {\n    const s = document.querySelector('deck-stage');\n    if (!s) { this._t = setTimeout(() => this._wire(), 250); return; }\n    this._stage = s;\n    const h = parseInt((location.hash || '').replace('#', ''), 10);\n    this._pintar(isNaN(h) ? 0 : h - 1, 32);\n    this._onSC = (e) => this._pintar(e.detail.index, e.detail.total);\n    s.addEventListener('slidechange', this._onSC);\n  }\n  _pintar(i, total) {\n    const mods = this._mods; if (!mods) return;\n    let act = mods[0];\n    for (const m of mods) { if (i >= m.ini) act = m; }\n    const fill = document.getElementById('pm-prog-fill');\n    if (fill) {\n      fill.style.width = (((i + 1) / (total || 32)) * 100) + '%';\n      fill.style.background = act.color;\n    }\n    for (const m of mods) {\n      const el = document.getElementById(m.id); if (!el) continue;\n      const on = m === act;\n      el.style.background = on ? m.color : 'transparent';\n      el.style.borderColor = on ? m.color : 'var(--line)';\n      el.style.color = on ? (m.oscuro ? '#0B090A' : '#F5F3F4') : 'var(--muted)';\n    }\n  }\n  renderVals() {\n    const salto = (n) => () => { const s = document.querySelector('deck-stage'); if (s && s.goTo) s.goTo(n); };\n    return {\n      temaEtiqueta: this.state.tema === 'oscuro' ? 'Claro' : 'Oscuro',\n      cambiarTema: () => this._setTema(this.state.tema === 'oscuro' ? 'claro' : 'oscuro', true),\n      irF: salto(0), irA: salto(5), irB: salto(19), irC: salto(25), irD: salto(29)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
